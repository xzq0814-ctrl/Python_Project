<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无畏契约赋能选手群聊</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-section {
            flex: 1;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .message.system {
            text-align: center;
            margin: 10px 0;
        }

        .message-bubble {
            max-width: 70%;
            min-width: 120px;
            width: fit-content;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .message.system .message-bubble {
            background: rgba(0,0,0,0.05);
            color: #666;
            font-size: 0.9rem;
            display: inline-block;
        }

        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .message.user .message-header {
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .message.other .message-header {
            justify-content: flex-start;
        }

        .message.system .message-header {
            justify-content: center;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 8px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .message.user .avatar {
            margin-right: 8px;
            margin-left: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .username {
            font-weight: 600;
            color: #555;
        }

        .timestamp {
            font-size: 0.75rem;
            color: #999;
            margin-left: 8px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        #message-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        #send-btn:active {
            transform: translateY(0);
        }



        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .message-bubble {
                max-width: 85%;
            }
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-section">
            <div class="header">
                <h1>无畏契约赋能选手群聊</h1>
                <div class="subtitle">实时沟通，高效配合</div>
            </div>

            <div id="messages" class="messages-container scrollbar-hide"></div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="输入消息..." maxlength="200">
                <button id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                    发送
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // 自动生成随机用户名并加入
        const adjectives = ['快乐', '可爱', '勇敢', '聪明', '温柔','菜菜','炸鱼'];
        const nouns = ['jett', '不死鸟', '奶妈', 'KO', '黑梦','霓虹','盖克','雷娜','尚博勒'];
        const username = adjectives[Math.floor(Math.random() * adjectives.length)] +
                        nouns[Math.floor(Math.random() * nouns.length)] +
                        Math.floor(Math.random() * 100);

        // 自动加入聊天室
        socket.emit('join', { username: username });

        // 发送消息
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                socket.emit('message', { username: username, message: message });
                messageInput.value = '';
            }
        }

        // 生成用户头像字母
        function getAvatarLetter(username) {
            return username.charAt(0).toUpperCase();
        }

        // 生成头像颜色
        function getAvatarColor(username) {
            const colors = [
                'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
            ];
            const index = username.length % colors.length;
            return colors[index];
        }

        // 添加消息
        function addMessage(data, isUserMessage = false, isSystemMessage = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUserMessage ? 'user' : isSystemMessage ? 'system' : 'other'}`;

            if (isSystemMessage) {
                messageDiv.innerHTML = `
                    <div class="message-bubble">
                        <i class="fas fa-info-circle"></i> ${data.message}
                    </div>
                `;
            } else {
                const avatarLetter = getAvatarLetter(data.username);
                const avatarColor = getAvatarColor(data.username);

                messageDiv.innerHTML = `
                    <div class="message-header">
                        <div class="avatar" style="background: ${avatarColor}">${avatarLetter}</div>
                        <span class="username">${data.username}</span>
                        <span class="timestamp">${data.timestamp || new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})}</span>
                    </div>
                    <div class="message-bubble">
                        ${data.message}
                    </div>
                `;
            }

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }



        // 接收消息
        socket.on('message', (data) => {
            const isUserMessage = data.username === username;
            addMessage(data, isUserMessage);
        });

        socket.on('user_joined', (data) => {
            addMessage(data, false, true);
        });

        socket.on('user_left', (data) => {
            addMessage(data, false, true);
        });
    </script>
</body>
</html>
